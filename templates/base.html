<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BusPass Cloud{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">B</span>BusPass <em>Cloud</em></a><span class="top-note">Simple • Smart • Connected</span></header>
<main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<section class="messages" aria-live="polite">{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}</section>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Cloud-Based Bus Pass System • Student Project Demo</footer></body></html>
